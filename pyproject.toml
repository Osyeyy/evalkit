[project]
name = "evalkit"
version = "0.1.0"
description = "Model inspection and evaluation framework"
requires-python = ">=3.11"

dependencies = [
    "huggingface_hub>=0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
evalkit = "evalkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]